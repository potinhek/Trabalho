# Arquivo: .github/workflows/cd.yml
# CORRIGIDO: Usa 'powershell' (padrão do Windows) em vez de 'pwsh'

name: CD - Deploy to Kubernetes
on:
  workflow_run:
    workflows: ["CI Build & Push Docker"] # Nome do workflow de CI
    types: [ "completed" ] # Roda quando o CI completar

permissions:
  contents: read

jobs:
  deploy:
    # Só roda se o workflow de CI foi um sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 CORRIGIDO: Trocado 'pwsh' por 'powershell'
      - name: Set vars
        id: vars
        shell: powershell 
        run: |
          echo "IMAGE=jacksonugv/trabalho" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          
          $RUN_SHA = "${{ github.event.workflow_run.head_sha }}"
          $TAG_SHA = $RUN_SHA.Substring(0, 7)
          echo "TAG_SHA=$TAG_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          
          $NAMESPACE = "${{ secrets.K8S_NAMESPACE || 'default'}}"
          echo "NAMESPACE=$NAMESPACE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 👇 CORRIGIDO: Trocado 'pwsh' por 'powershell' e sintaxe do 'mkdir'
      - name: Configure kubeconfig
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path (Join-Path $env:USERPROFILE ".kube") -ErrorAction SilentlyContinue
          $KUBE_CONFIG_BYTES = [System.Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")
          [System.Text.Encoding]::UTF8.GetString($KUBE_CONFIG_BYTES) | Out-File -FilePath (Join-Path $env:USERPROFILE ".kube\config")

      # 👇 CORRIGIDO: Trocado 'pwsh' por 'powershell' e sintaxe do 'if'
      - name: Create namespace if not exists
        shell: powershell
        run: |
          kubectl get ns ${{ steps.vars.outputs.NAMESPACE }} -ErrorAction SilentlyContinue
          if ($LASTEXITCODE -ne 0) {
            kubectl create ns ${{ steps.vars.outputs.NAMESPACE }}
          }

      # 👇 CORRIGIDO: Trocado 'pwsh' por 'powershell' e adicionado -ErrorAction
      - name: Apply base manifests (Service, Prometheus, Grafana, Nginx)
        shell: powershell
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/service.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/grafana-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-deployment.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-service.yaml -ErrorAction SilentlyContinue
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-config.yaml -ErrorAction SilentlyContinue

      # 👇 Adicionado 'shell: powershell' para garantir
      - name: Apply app deployment (first time)
        shell: powershell
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/deployment.yaml

      # 👇 Adicionado 'shell: powershell' e nome do deployment corrigido
      - name: Set image to new tag
        shell: powershell
        run: |
          kubectl set image deployment/trabalho trabalho=${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG_SHA }} -n ${{ steps.vars.outputs.NAMESPACE }}

      # 👇 Adicionado 'shell: powershell' e nome do deployment corrigido
      - name: Wait rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/trabalho -n ${{ steps.vars.outputs.NAMESPACE }} --timeout=120s
          
      # 👇 Adicionado 'shell: powershell' para garantir
      - name: Show services (debug)
        shell: powershell
        run: |
          kubectl get svc -n ${{ steps.vars.outputs.NAMESPACE }}
          kubectl get pods -o wide -n ${{ steps.vars.outputs.NAMESPACE }}