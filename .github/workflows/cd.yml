# Arquivo: .github/workflows/cd.yml

name: CD - Deploy to Kubernetes
on:
  workflow_run:
    [cite_start]workflows: ["CI Build & Push Docker"] # Nome do workflow de CI [cite: 53]
    [cite_start]types: [ "completed" ] # Roda quando o CI completar [cite: 135]

permissions:
  [cite_start]contents: read [cite: 137]

jobs:
  deploy:
    # Só roda se o workflow de CI foi um sucesso
    [cite_start]if: ${{ github.event.workflow_run.conclusion == 'success' }} [cite: 140]
    [cite_start]runs-on: ubuntu-latest [cite: 143]
    
    steps:
      - name: Checkout
        [cite_start]uses: actions/checkout@v4 [cite: 147]

      - name: Set vars
        [cite_start]id: vars [cite: 149]
        run: |
          # 👇 AQUI ESTÁ A CORREÇÃO 👇
          echo "IMAGE=jacksonugv/trabalho" >> $GITHUB_OUTPUT [cite: 151]
          echo "TAG_SHA=${{ github.event.workflow_run.head_sha::7 }}" >> $GITHUB_OUTPUT # Pega o SHA do CI
          echo "NAMESPACE=${{ secrets.K8S_NAMESPACE || 'default'}}" >> $GITHUB_OUTPUT [cite: 153]

      - name: Setup kubectl
        [cite_start]uses: azure/setup-kubectl@v4 [cite: 156]
        with:
          [cite_start]version: 'latest' [cite: 158]

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube [cite: 160]
          # Decodifica o KUBE_CONFIG_DATA do Secret
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config [cite: 161]

      - name: Create namespace if not exists
        run: |
          kubectl get ns ${{ steps.vars.outputs.NAMESPACE }} || \
          kubectl create ns ${{ steps.vars.outputs.NAMESPACE }} [cite: 165, 166]

      # Aplica os manifestos base (como no seu PDF)
      - [cite_start]name: Apply base manifests (Service, Prometheus, Grafana, Nginx) [cite: 169]
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/service.yaml || true [cite: 170]
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-deployment.yaml || true [cite: 171]
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/grafana-deployment.yaml || true [cite: 174]
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-deployment.yaml || true [cite: 176]
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/nginx-service.yaml || true [cite: 177]
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/prometheus-config.yaml || true [cite: 178]

      # Aplica o deployment do app (garante que exista)
      - [cite_start]name: Apply app deployment (first time) [cite: 180]
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/deployment.yaml [cite: 182]

      # ATUALIZA a imagem para a nova tag [cite: 184]
      - [cite_start]name: Set image to new tag [cite: 185]
        run: |
          kubectl set image deployment/monitor monitor=${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG_SHA }} -n ${{ steps.vars.outputs.NAMESPACE }} [cite: 187]

      # Espera o deploy terminar
      - [cite_start]name: Wait rollout [cite: 188]
        run: |
          kubectl rollout status deployment/monitor -n ${{ steps.vars.outputs.NAMESPACE }} --timeout=120s [cite: 190]
          
      - [cite_start]name: Show services (debug) [cite: 191]
        run: |
          kubectl get svc -n ${{ steps.vars.outputs.NAMESPACE }} [cite: 193]
          kubectl get pods -o wide -n ${{ steps.vars.outputs.NAMESPACE }} [cite: 194] 