# .github/workflows/cd.yml
name: CD - Deploy to Kubernetes
on:
  workflow_run:
    workflows: ["CI Build & Push Docker"]
    types: ["completed"]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vars
        id: vars
        shell: powershell
        run: |
          "IMAGE=jacksonugv/trabalho" | Out-File $env:GITHUB_OUTPUT -Append
          $TAG_SHA = "${{ github.event.workflow_run.head_sha }}".Substring(0,7)
          "TAG_SHA=$TAG_SHA" | Out-File $env:GITHUB_OUTPUT -Append
          $ns = "${{ secrets.K8S_NAMESPACE }}"
          if ([string]::IsNullOrWhiteSpace($ns)) { $ns = 'default' }
          "NAMESPACE=$ns" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 🔧 MODIFIED STEP: Writes raw bytes from base64 to disk.
      # This avoids all text encoding issues (like BOM)
      - name: Configure kubeconfig (from Base64 Bytes)
        shell: powershell
        run: |
          $kubeDir = Join-Path $env:USERPROFILE ".kube"
          New-Item -ItemType Directory -Path $kubeDir -Force | Out-Null
          $path = Join-Path $kubeDir "config"
          $bytes = [Convert]::FromBase64String("${{ secrets.KUBE_CONFIG_DATA }}")
          [IO.File]::WriteAllBytes($path, $bytes)

      # 🔧 MODIFIED STEP: Use "kubectl version --client"
      # This tests the binary without loading the config.
      # The "current-context" command will then test the config.
      - name: Smoke test kubectl
        shell: powershell
        run: |
          kubectl version --client
          kubectl config current-context

      - name: Create namespace if not exists
        shell: powershell
        run: |
          $ns='${{ steps.vars.outputs.NAMESPACE }}'
          kubectl get ns $ns 2>$null
          if ($LASTEXITCODE -ne 0) { kubectl create ns $ns }

      - name: Apply base manifests (Service, Prometheus, Grafana, Nginx)
        shell: powershell
        run: |
          $ns='${{ steps.vars.outputs.NAMESPACE }}'
          kubectl apply -n $ns -f k8s/service.yaml
          kubectl apply -n $ns -f k8s/prometheus-config.yaml
          kubectl apply -n $ns -f k8s/prometheus-deployment.yaml
          kubectl apply -n $ns -f k8s/grafana-deployment.yaml
          kubectl apply -n $ns -f k8s/nginx-deployment.yaml
          kubectl apply -n $ns -f k8s/nginx-service.yaml

      - name: Apply app deployment (first time)
        shell: powershell
        run: |
          kubectl apply -n ${{ steps.vars.outputs.NAMESPACE }} -f k8s/deployment.yaml

      - name: Set image to new tag
        shell: powershell
        run: |
          kubectl set image deployment/trabalho trabalho=${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG_SHA }} -n ${{ steps.vars.outputs.NAMESPACE }}

      - name: Wait rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/trabalho -n ${{ steps.vars.outputs.NAMESPACE }} --timeout=120s

      - name: Show services (debug)
        shell: powershell
        run: |
          kubectl get svc -n ${{ steps.vars.outputs.NAMESPACE }}
          kubectl get pods -o wide -n ${{ steps.vars.outputs.NAMESPACE }}