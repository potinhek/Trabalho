name: CD - Deploy to Kubernetes (Self-Hosted)

on:
  workflow_run:
    workflows: ["CI - Build & Push Docker"]
    types: ["completed"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set vars
        id: vars
        shell: powershell
        run: |
          "IMAGE=seuusuario/monitor" >> $env:GITHUB_OUTPUT
          "TAG_SHA=$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_OUTPUT
          $ns = "${{ secrets.K8S_NAMESPACE }}"
          if ([string]::IsNullOrWhiteSpace($ns)) { $ns = "default" }
          "NAMESPACE=$ns" >> $env:GITHUB_OUTPUT

      # --- kubectl disponível ---
      - name: Ensure kubectl
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command kubectl -ErrorAction SilentlyContinue)) {
            Write-Host "kubectl não encontrado. Instalando..."
            Invoke-WebRequest -UseBasicParsing -Uri https://dl.k8s.io/release/stable.txt -OutFile stable.txt
            $ver = Get-Content stable.txt
            $url = "https://dl.k8s.io/release/$ver/bin/windows/amd64/kubectl.exe"
            $bin = Join-Path $env:RUNNER_TEMP "bin"
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile (Join-Path $bin "kubectl.exe")
            "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
          }
          kubectl version --client=true

      # --- Garante Docker Desktop / escolhe driver ---
      - name: Ensure Docker/driver
        shell: powershell
        run: |
          $global:DRIVER = "docker"
          if (-not (Get-Command docker -ErrorAction SilentlyContinue)) {
            $global:DRIVER = "hyperv"
          } else {
            # Tenta garantir Docker Desktop iniciado
            try {
              docker info 1>$null 2>$null
            } catch {
              $dockerExe = "C:\Program Files\Docker\Docker\Docker Desktop.exe"
              if (Test-Path $dockerExe) {
                Start-Process -FilePath $dockerExe
                Write-Host "Iniciando Docker Desktop e aguardando..."
                for ($i=1; $i -le 40; $i++) {
                  try { docker info 1>$null 2>$null; break } catch { Start-Sleep -Seconds 3 }
                  if ($i -eq 40) { throw "Docker não ficou pronto." }
                }
              }
            }
          }
          "DRIVER=$global:DRIVER" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Driver selecionado: $global:DRIVER"

      # --- Minikube ligado e contexto atualizado ---
      - name: Ensure Minikube running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = "${{ env.DRIVER }}"
          if (-not (Get-Command minikube -ErrorAction SilentlyContinue)) {
            throw "Minikube não está instalado no runner."
          }

          $ok = $false
          try {
            $st = minikube status --output=json | ConvertFrom-Json
            if ($st.Host -eq 'Running' -and $st.Kubelet -eq 'Running' -and $st.APIServer -eq 'Running') { $ok = $true }
          } catch { }

          if (-not $ok) {
            Write-Host "Iniciando Minikube (--driver=$driver)..."
            minikube start --driver=$driver
          }

          # Atualiza kubeconfig/contexto do usuário
          minikube update-context
          $env:KUBECONFIG = "$env:USERPROFILE\.kube\config"

          # Se o server for 127.0.0.1:PORT, troca para <minikube ip>:8443
          $server = kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          $clusterName = kubectl config view --minify -o jsonpath='{.clusters[0].name}'
          if ($server -match '^https://127\.0\.0\.1:\d+$') {
            $mkip = minikube ip
            if (-not $mkip) { throw "minikube ip não retornou IP." }
            $new = "https://$mkip:8443"
            Write-Host "Reescrevendo server do cluster '$clusterName' para $new"
            kubectl config set-cluster $clusterName --server=$new | Out-Null
          }

          $ctx = kubectl config current-context
          Write-Host "Contexto atual: $ctx"
          $server = kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          Write-Host "API Server: $server"

      # --- Health-check do API server com retry ---
      - name: Wait for API server (healthz)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i=1; $i -le 30; $i++) {
            try {
              $h = kubectl get --raw=/healthz 2>$null
              if ($LASTEXITCODE -eq 0 -and $h -match "ok") { Write-Host "API Server OK"; break }
            } catch { }
            Write-Host "Aguardando API Server ($i/30)..."
            Start-Sleep -Seconds 3
            if ($i -eq 30) { throw "API Server indisponível (timeout)." }
          }
          kubectl cluster-info
          kubectl get nodes -o wide

      # --- Namespace (idempotente) ---
      - name: Create namespace if not exists
        shell: powershell
        env:
          NS: ${{ steps.vars.outputs.NAMESPACE }}
        run: |
          kubectl get ns $env:NS *> $null
          if ($LASTEXITCODE -ne 0) { kubectl create ns $env:NS }
          kubectl get ns $env:NS

      # --- Manifests base (best-effort) ---
      - name: Apply base manifests
        shell: powershell
        env:
          NS: ${{ steps.vars.outputs.NAMESPACE }}
        run: |
          kubectl apply -n $env:NS -f k8s/service.yaml               || $true
          kubectl apply -n $env:NS -f k8s/prometheus-deployment.yaml || $true
          kubectl apply -n $env:NS -f k8s/grafana-deployment.yaml    || $true
          kubectl apply -n $env:NS -f k8s/nginx-deployment.yaml      || $true
          kubectl apply -n $env:NS -f k8s/nginx-service.yaml         || $true
          kubectl apply -n $env:NS -f k8s/prometheus-config.yaml     || $true

      # --- App principal ---
      - name: Apply app deployment
        shell: powershell
        env:
          NS: ${{ steps.vars.outputs.NAMESPACE }}
        run: |
          kubectl apply -n $env:NS -f k8s/deployment.yaml

      - name: Set image to new tag
        shell: powershell
        env:
          NS:  ${{ steps.vars.outputs.NAMESPACE }}
          IMG: ${{ steps.vars.outputs.IMAGE }}
          TAG: ${{ steps.vars.outputs.TAG_SHA }}
        run: |
          kubectl set image deployment/monitor monitor="$env:IMG:$env:TAG" -n $env:NS

      - name: Wait rollout
        shell: powershell
        env:
          NS: ${{ steps.vars.outputs.NAMESPACE }}
        run: |
          kubectl rollout status deployment/monitor -n $env:NS --timeout=180s

      - name: Show services/pods
        shell: powershell
        env:
          NS: ${{ steps.vars.outputs.NAMESPACE }}
        run: |
          kubectl get svc -n $env:NS
          kubectl get deploy -n $env:NS
          kubectl get pods -o wide -n $env:NS
